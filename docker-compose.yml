services:
  backend:
    build: ./Backend
    volumes:
      - fwtt_data:/data
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_PATH=/data/app.db
      - CORS_ALLOW_ORIGINS=http://127.0.0.1:8081
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - VITE_API_BASE_URL=http://127.0.0.1:8001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fwtt_data:
